<svg width="200" height="200" viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="halftone" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#444444"/>
    </pattern>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <mask id="dotMask">
      <rect width="200" height="200" fill="url(#vignette)"/>
    </mask>

    <linearGradient id="fade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#b84fd0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b84fd0" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="rounded">
      <rect x="0" y="0" width="200" height="200" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="200" height="200" fill="#000000"/>
    <rect width="200" height="200" fill="url(#halftone)" mask="url(#dotMask)"/>
    <line x1="30" y1="170" x2="170" y2="30" stroke="url(#fade)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
