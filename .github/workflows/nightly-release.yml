name: Nightly builds

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Resolve shared authentication dependencies
        working-directory: packages/auth
        run: dart pub get --enforce-lockfile

      - name: Resolve CLI dependencies
        working-directory: packages/cli
        run: dart pub get --enforce-lockfile

      - name: Check Dart formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test
          packages/auth/lib packages/auth/test
          packages/cli/bin packages/cli/lib

      - name: Analyze Flutter application
        run: flutter analyze

      - name: Test Flutter application
        run: flutter test

      - name: Analyze shared authentication package
        working-directory: packages/auth
        run: dart analyze

      - name: Test shared authentication package
        working-directory: packages/auth
        run: dart test

      - name: Analyze CLI package
        working-directory: packages/cli
        run: dart analyze

  build-mobile-web:
    name: Build ${{ matrix.target }} release
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: ios
            os: macos-latest
          - target: web
            os: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android APK
        if: matrix.target == 'android'
        run: flutter build apk --release --split-per-abi

      - name: Prepare Android artifact
        if: matrix.target == 'android'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/thulium-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/thulium-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/thulium-android-x86_64.apk

      - name: Build unsigned iOS app
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign

      - name: Package iOS artifact
        if: matrix.target == 'ios'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app dist/thulium-ios-unsigned.zip

      - name: Build web release
        if: matrix.target == 'web'
        run: flutter build web --release

      - name: Package web artifact
        if: matrix.target == 'web'
        run: |
          mkdir -p dist
          tar -C build/web -czf dist/thulium-web.tar.gz .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: thulium-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-desktop:
    name: Build ${{ matrix.target }} release
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux release
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Package Linux artifact
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf dist/thulium-linux-x64.tar.gz bundle

      - name: Build Windows release
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Package Windows artifact
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/thulium-windows-x64.zip -Force

      - name: Build macOS release
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Package macOS artifact
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/thulium.app dist/thulium-macos.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: thulium-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-cli:
    name: Build Dart CLI (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            output: thulium-linux-x64
          - target: windows-x64
            os: windows-latest
            output: thulium-windows-x64.exe
          - target: macos-arm64
            os: macos-latest
            output: thulium-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Resolve CLI dependencies
        working-directory: packages/cli
        run: dart pub get --enforce-lockfile

      - name: Prepare CLI output directory
        if: runner.os != 'Windows'
        working-directory: packages/cli
        run: mkdir -p dist

      - name: Prepare CLI output directory on Windows
        if: runner.os == 'Windows'
        working-directory: packages/cli
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Compile CLI executable
        working-directory: packages/cli
        run: dart compile exe bin/thulium.dart -o dist/${{ matrix.output }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: thulium-cli-${{ matrix.target }}
          path: packages/cli/dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14
